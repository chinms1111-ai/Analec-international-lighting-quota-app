 {% extends "base.html" %}
{% block title %}{{ 'Edit Item' if item else 'Add Item' }}{% endblock %}
{% block content %}
  <div class="page-header">
    <h1>{{ 'Edit Item' if item else 'Add Item' }}</h1>
  </div>

  <form method="post" class="form-card" list-datalist>
    <label>Category
      <input type="text" name="category" list="category-list" value="{{ item.category if item else '' }}" required>
      <datalist id="category-list">
        <option value="Cable"><option value="Distribution Boards">
        <option value="Switches"><option value="Conduit">
      </datalist>
    </label>

    <label>Item Name
      <input type="text" name="name" value="{{ item.name if item else '' }}" required>
    </label>

    <label>Brand / Range <span class="muted" style="font-weight:normal;">(optional)</span>
      <input type="text" name="brand" placeholder="e.g. Nexans, Tiger, Coleman" value="{{ item.brand if item else '' }}">
    </label>

    <label>Unit
      <input type="text" name="unit" placeholder="e.g. Coil, Piece" value="{{ item.unit if item else '' }}" required>
    </label>

    <label>Cost Price (₦)
      <input type="number" step="0.01" min="0" name="cost_price" value="{{ item.cost_price if item else '' }}" required>
    </label>

    <label>Markup %
      <input type="number" step="0.1" min="0" name="markup_pct" value="{{ (item.markup_pct * 100)|round(2) if item else '' }}" required>
    </label>

    <label>Quantity on Hand
      <input type="number" step="1" min="0" name="quantity_on_hand" value="{{ item.quantity_on_hand if item else 0 }}">
    </label>

    <label>Low Stock Alert Threshold
      <input type="number" step="1" min="0" name="low_stock_threshold" value="{{ item.low_stock_threshold if item else 5 }}">
    </label>

    <label>Notes
      <input type="text" name="notes" value="{{ item.notes if item else '' }}">
    </label>

    <div class="form-actions">
      <a href="{{ url_for('price_list') }}" class="btn btn-ghost">Cancel</a>
      <button type="submit" class="btn btn-primary">{{ 'Save Changes' if item else 'Add Item' }}</button>
    </div>
  </form>
{% endblock %}
