{% extends "base.html" %}
{% block title %}New Quote{% endblock %}
{% block content %}
  <div class="page-header">
    <h1>New Quote</h1>
  </div>

  <form method="post" id="quote-form" class="form-card">
    <div class="grid-2">
      <label>Customer
        <select id="customer-select" name="customer_id">
          <option value="">-- select existing customer --</option>
          <option value="__new__">+ New customer</option>
        </select>
      </label>
      <label>Project / Site
        <input type="text" name="project_site">
      </label>
      <label>Discount %
        <input type="number" step="0.1" min="0" max="100" name="discount_pct" value="0">
      </label>
    </div>

    <div id="new-customer-fields" class="grid-2" style="display:none;">
      <label>New Customer Name
        <input type="text" id="new-customer-name" name="new_customer_name">
      </label>
      <label>Phone Number
        <input type="text" name="new_customer_phone">
      </label>
      <label>Address / Location
        <input type="text" name="new_customer_address">
      </label>
    </div>

    <h2 class="cat-title">Items</h2>
    <div class="table-wrap">
      <table id="items-table">
        <thead>
          <tr>
            <th>Item</th>
            <th>Unit</th>
            <th>Qty</th>
            <th>Unit Price (₦)</th>
            <th>Line Total (₦)</th>
            <th>Stock</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="items-body"></tbody>
      </table>
    </div>
    <div class="form-actions" style="justify-content:flex-start; gap:0.75rem; flex-wrap:wrap;">
      <button type="button" id="add-row-btn" class="btn btn-ghost">+ Add Item Row</button>
      <button type="button" id="add-custom-row-btn" class="btn btn-ghost">+ Add Custom Item Row</button>
      <button type="button" id="scan-btn" class="btn btn-ghost">📷 Scan Paper List</button>
      <input type="file" id="scan-file-input" accept="image/*" capture="environment" style="display:none;">
    </div>
    <div id="scan-status" style="display:none; margin-top:0.5rem; font-size:0.9rem;"></div>

    <div class="totals-box">
      <div><span>Subtotal</span><span id="subtotal-display">₦0</span></div>
      <div><span>Discount Amount</span><span id="discount-display">₦0</span></div>
      <div class="grand"><span>Grand Total</span><span id="grand-display">₦0</span></div>
    </div>

    <div class="form-actions">
      <a href="{{ url_for('price_list') }}" class="btn btn-ghost">Cancel</a>
      <button type="submit" class="btn btn-primary">Save Quote</button>
    </div>
  </form>

<script>
let CATALOG = [];
let CUSTOMERS = [];

async function loadCatalog() {
  const res = await fetch("{{ url_for('api_items') }}");
  CATALOG = await res.json();
}

async function loadCustomers() {
  const res = await fetch("{{ url_for('api_customers') }}");
  CUSTOMERS = await res.json();
  const select = document.getElementById('customer-select');
  const newOpt = select.querySelector('option[value="__new__"]');
  for (const c of CUSTOMERS) {
    const opt = document.createElement('option');
    opt.value = c.id;
    opt.textContent = c.phone ? `${c.name} (${c.phone})` : c.name;
    select.insertBefore(opt, newOpt);
  }
  const preselect = new URLSearchParams(window.location.search).get('customer_id');
  if (preselect) select.value = preselect;
  toggleNewCustomerFields();
}

function toggleNewCustomerFields() {
  const select = document.getElementById('customer-select');
  const wrap = document.getElementById('new-customer-fields');
  const nameInput = document.getElementById('new-customer-name');
  const isNew = select.value === '__new__';
  wrap.style.display = isNew ? 'grid' : 'none';
  nameInput.required = isNew;
  if (isNew) select.removeAttribute('name');
  else select.setAttribute('name', 'customer_id');
}

document.getElementById('customer-select').addEventListener('change', toggleNewCustomerFields);

function itemOptions(selectedId) {
  let opts = '<option value="">-- select item --</option>';
  for (const it of CATALOG) {
    const sel = (selectedId && String(selectedId) === String(it.id)) ? 'selected' : '';
    const label = it.brand ? `${it.name} (${it.brand})` : it.name;
    opts += `<option value="${it.id}" ${sel}>${label}</option>`;
  }
  return opts;
}

// ---- Catalog rows (existing behaviour, untouched) ----
function addRow() {
  const tbody = document.getElementById('items-body');
  const idx = tbody.children.length;
  const tr = document.createElement('tr');
  tr.innerHTML = `
    <td><select name="item_id[]" class="item-select" data-idx="${idx}">${itemOptions()}</select></td>
    <td class="unit-cell muted-cell">—</td>
    <td><input type="number" name="qty[]" class="qty-input" min="0" step="1" value=""></td>
    <td class="price-cell">₦0</td>
    <td class="linetotal-cell">₦0</td>
    <td class="stock-cell muted-cell">—</td>
    <td><button type="button" class="link-btn remove-row">Remove</button></td>
  `;
  tbody.appendChild(tr);
  wireRow(tr);
}

function wireRow(tr) {
  const select = tr.querySelector('.item-select');
  const qty = tr.querySelector('.qty-input');
  const unitCell = tr.querySelector('.unit-cell');
  const priceCell = tr.querySelector('.price-cell');
  const totalCell = tr.querySelector('.linetotal-cell');
  const stockCell = tr.querySelector('.stock-cell');
  const removeBtn = tr.querySelector('.remove-row');

  function recalcRow() {
    const item = CATALOG.find(i => String(i.id) === select.value);
    const price = item ? item.price : 0;
    const unit = item ? item.unit : '—';
    const q = parseFloat(qty.value) || 0;
    unitCell.textContent = unit;
    priceCell.textContent = '₦' + price.toLocaleString();
    priceCell.dataset.price = price;
    totalCell.textContent = '₦' + (price * q).toLocaleString();
    totalCell.dataset.total = price * q;

    if (item) {
      const short = q > item.stock;
      stockCell.textContent = item.stock + (short ? ' ⚠ short' : ' in stock');
      stockCell.className = short ? 'stock-cell badge badge-declined' : 'stock-cell muted-cell';
    } else {
      stockCell.textContent = '—';
      stockCell.className = 'stock-cell muted-cell';
    }

    recalcTotals();
  }

  select.addEventListener('change', recalcRow);
  qty.addEventListener('input', recalcRow);
  removeBtn.addEventListener('click', () => { tr.remove(); recalcTotals(); });
}

// ---- Custom rows (new: for items not in your catalog) ----
// Accepts an optional prefill object: { name, unit, qty, price } — used both
// for manually-added blank rows and rows auto-filled from a paper scan.
function addCustomRow(prefill) {
  prefill = prefill || {};
  const tbody = document.getElementById('items-body');
  const tr = document.createElement('tr');
  tr.className = 'custom-row';
  const name = prefill.name ? String(prefill.name).replace(/"/g, '&quot;') : '';
  const unit = prefill.unit ? String(prefill.unit).replace(/"/g, '&quot;') : 'piece';
  const qty = (prefill.qty !== undefined && prefill.qty !== null) ? prefill.qty : '';
  const price = (prefill.price !== undefined && prefill.price !== null) ? prefill.price : '';
  const fromScan = prefill.fromScan ? ' (from scan — please check)' : '';
  tr.innerHTML = `
    <td>
      <input type="text" name="custom_name[]" class="custom-name-input" placeholder="Item name (from paper)" value="${name}">
      ${fromScan ? '<div style="font-size:0.7rem; color:#a06b00;">from scan — please check</div>' : ''}
      <label class="save-to-catalog-label" style="display:block; font-size:0.75rem; font-weight:400; margin-top:0.25rem;">
        <input type="checkbox" class="save-to-catalog-check">
        also save to my catalog
      </label>
      <input type="hidden" name="custom_save_to_catalog[]" class="save-to-catalog-hidden" value="0">
    </td>
    <td><input type="text" name="custom_unit[]" class="custom-unit-input" placeholder="e.g. piece" value="${unit}" style="width:80px;"></td>
    <td><input type="number" name="custom_qty[]" class="qty-input" min="0" step="1" value="${qty}"></td>
    <td><input type="number" name="custom_price[]" class="custom-price-input" min="0" step="1" placeholder="0" value="${price}" style="width:110px;"></td>
    <td class="linetotal-cell">₦0</td>
    <td class="stock-cell muted-cell">custom</td>
    <td><button type="button" class="link-btn remove-row">Remove</button></td>
  `;
  tbody.appendChild(tr);
  wireCustomRow(tr);
  return tr;
}

function wireCustomRow(tr) {
  const qty = tr.querySelector('.qty-input');
  const price = tr.querySelector('.custom-price-input');
  const totalCell = tr.querySelector('.linetotal-cell');
  const removeBtn = tr.querySelector('.remove-row');
  const saveCheck = tr.querySelector('.save-to-catalog-check');
  const saveHidden = tr.querySelector('.save-to-catalog-hidden');

  function recalcRow() {
    const p = parseFloat(price.value) || 0;
    const q = parseFloat(qty.value) || 0;
    totalCell.textContent = '₦' + (p * q).toLocaleString();
    totalCell.dataset.total = p * q;
    recalcTotals();
  }

  qty.addEventListener('input', recalcRow);
  price.addEventListener('input', recalcRow);
  saveCheck.addEventListener('change', () => {
    saveHidden.value = saveCheck.checked ? '1' : '0';
  });
  removeBtn.addEventListener('click', () => { tr.remove(); recalcTotals(); });

  recalcRow(); // run once immediately in case the row was prefilled (e.g. from a scan)
}

function recalcTotals() {
  let subtotal = 0;
  document.querySelectorAll('.linetotal-cell').forEach(td => {
    subtotal += parseFloat(td.dataset.total) || 0;
  });
  const discountPct = (parseFloat(document.querySelector('[name="discount_pct"]').value) || 0) / 100;
  const discountAmt = subtotal * discountPct;
  const grand = subtotal - discountAmt;
  document.getElementById('subtotal-display').textContent = '₦' + subtotal.toLocaleString();
  document.getElementById('discount-display').textContent = '₦' + discountAmt.toLocaleString();
  document.getElementById('grand-display').textContent = '₦' + grand.toLocaleString();
}

document.getElementById('add-row-btn').addEventListener('click', addRow);
document.getElementById('add-custom-row-btn').addEventListener('click', () => addCustomRow());
document.querySelector('[name="discount_pct"]').addEventListener('input', recalcTotals);

loadCatalog().then(() => { addRow(); addRow(); addRow(); });
loadCustomers();

// ---- Scan a paper price list and auto-fill custom rows ----
const scanBtn = document.getElementById('scan-btn');
const scanFileInput = document.getElementById('scan-file-input');
const scanStatus = document.getElementById('scan-status');

scanBtn.addEventListener('click', () => scanFileInput.click());

scanFileInput.addEventListener('change', async () => {
  const file = scanFileInput.files[0];
  if (!file) return;

  scanBtn.disabled = true;
  scanStatus.style.display = 'block';
  scanStatus.textContent = 'Reading your paper list… this can take a few seconds.';

  const formData = new FormData();
  formData.append('image', file);

  try {
    const res = await fetch("{{ url_for('quote_scan') }}", {
      method: 'POST',
      body: formData,
    });
    const data = await res.json();

    if (!res.ok) {
      scanStatus.textContent = 'Scan failed: ' + (data.error || 'unknown error') + '. You can still add items manually below.';
      return;
    }

    if (!data.items || data.items.length === 0) {
      scanStatus.textContent = 'No items could be read from that photo. Try a clearer, well-lit shot, or add items manually.';
      return;
    }

    for (const item of data.items) {
      addCustomRow({
        name: item.name,
        unit: item.unit,
        qty: item.qty,
        price: item.price,
        fromScan: true,
      });
    }

    scanStatus.textContent = `Added ${data.items.length} item(s) from your photo — please check each one before saving, especially the prices.`;
  } catch (err) {
    scanStatus.textContent = 'Something went wrong reaching the scan service. You can still add items manually below.';
  } finally {
    scanBtn.disabled = false;
    scanFileInput.value = ''; // allow re-selecting the same file again later
  }
});
</script>
{% endblock %}
