{% extends "base.html" %}
{% block title %}Settings{% endblock %}
{% block content %}
  <div class="page-header">
    <h1>Business Settings</h1>
  </div>

  <form method="post" class="form-card">
    <label>Business Name
      <input type="text" name="business_name" value="{{ s.business_name }}" required>
    </label>
    <label>Tagline
      <input type="text" name="tagline" value="{{ s.tagline }}">
    </label>
    <label>Address
      <input type="text" name="address" value="{{ s.address }}">
    </label>
    <label>Phone
      <input type="text" name="phone" value="{{ s.phone }}">
    </label>
    <label>Quote Validity (days)
      <input type="number" min="1" name="quote_validity_days" value="{{ s.quote_validity_days }}">
    </label>

    <h2 class="cat-title">Payment Details (shown on quotes)</h2>
    <label>Bank Name
      <input type="text" name="bank_name" value="{{ s.bank_name }}">
    </label>
    <label>Account Number
      <input type="text" name="account_number" value="{{ s.account_number }}">
    </label>
    <label>Account Name
      <input type="text" name="account_name" value="{{ s.account_name }}">
    </label>

    <div class="form-actions">
      <button type="submit" class="btn btn-primary">Save Settings</button>
    </div>
  </form>
{% endblock %}
